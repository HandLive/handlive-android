# Chỉ ghi đè những quy tắc cần thiết; còn lại theo cấu hình mặc định của detekt.
naming:
  FunctionNaming:
    # Hàm @Composable đặt tên PascalCase theo quy ước Compose.
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateMember:
    # Hàm @Preview chỉ công cụ xem trước của Android Studio gọi tới.
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    # A Room entity mirrors its table (0.9.1): one constructor parameter per column. Composables take
    # optional styling parameters with defaults, as the Compose API guidelines recommend.
    ignoreAnnotated: ['Entity', 'Composable']
  TooManyFunctions:
    # A Room DAO groups the queries of one table.
    ignoreAnnotated: ['Dao']
