# CI Android: unit test JVM + Android Lint + ktlint + detekt (`./gradlew check`).
# Bố cục workspace như máy dev: kho hub handlive ở gốc (test core:design đọc ../docs/design-system), kho này ở
# android/, kho handlive-shared ở shared/ (Gradle và test đọc ../shared). Hub phải checkout TRƯỚC (checkout ở gốc dọn sạch thư mục).
# Sửa shared không tự kích hoạt workflow này: chạy tay (workflow_dispatch) sau khi shared đổi.
# Kho private trong group cần secret HANDLIVE_REPOS_TOKEN (quyền đọc nội dung các kho); kho public thì github.token đủ.
# Every action is pinned to a full commit SHA (tag in the comment); checkouts keep no credentials in .git/config.
name: ci-android

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  check:
    name: gradlew check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Resolve matching branches of the hub and handlive-shared
        id: refs
        # Runs before any checkout, so android/ (the job's default directory) does not exist yet.
        working-directory: ${{ github.workspace }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          # gh reads GH_TOKEN from the environment: the token never appears in a URL or on a command line.
          resolve() {
            # The branch name is data: URL-encoded in the path and passed to jq with --arg, never spliced into code.
            enc="$(jq -rn --arg b "$BRANCH" '$b|@uri')"
            n="$(gh api "repos/${OWNER}/$1/git/matching-refs/heads/${enc}" 2>/dev/null | jq --arg r "refs/heads/$BRANCH" 'map(select(.ref == $r)) | length' 2>/dev/null || echo 0)"
            if [ "$n" = 1 ]; then echo "$BRANCH"; else echo main; fi
          }
          hub="$(resolve handlive)"; shared="$(resolve handlive-shared)"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "hub → $hub, handlive-shared → $shared"

      - name: Kho hub handlive ở gốc workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive
          ref: ${{ steps.refs.outputs.hub }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: android
          persist-credentials: false

      - name: Kho handlive-shared cạnh android/
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          ref: ${{ steps.refs.outputs.shared }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (targetSdk 35); the API 37 package is named platforms;android-37.0. setup-android accepts the
      # licenses so AGP can fetch missing build-tools.
      - name: Android SDK platform 37
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-37.0"

      # Cache ~/.gradle (dependency, wrapper, build cache) và kiểm checksum gradle-wrapper.jar.
      - name: Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/feat/') }}

      - name: ./gradlew check
        run: ./gradlew check --stacktrace

      - name: Upload báo cáo test/lint khi lỗi
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
